<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>落星 Fallen Stars</title>
  <meta name="description" content="落星 Fallen Stars 下载 · Download">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg bg-blur" id="bg-blur" aria-hidden="true"></div>

  <header class="top">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 class="name" data-t="name"></h1>

      <!-- 简介：写在 main.js 的 TEXT.zh.intro / TEXT.en.intro 里；空的时候这一行不显示 -->
      <p class="intro" id="intro" hidden></p>

      <div class="downloads">
        <a class="dl" id="dl-windows" href="#">
          <svg class="dl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5 10.5 4.4v7.1H3zm8.5-1.2L21 3v8.5h-9.5zM3 12.5h7.5v7.1L3 18.5zm8.5 0H21V21l-9.5-1.3z"/></svg>
          <span class="dl-text">
            <span class="dl-title" data-t="winTitle"></span>
            <span class="dl-sub" data-t="winSub"></span>
          </span>
        </a>
        <a class="dl" id="dl-android" href="#">
          <svg class="dl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 9.2 19.2 6.3a.5.5 0 0 0-.9-.5l-1.7 3A9.8 9.8 0 0 0 12 7.9c-1.6 0-3.2.3-4.6.9l-1.7-3a.5.5 0 0 0-.9.5l1.7 2.9A8.6 8.6 0 0 0 2 16h20a8.6 8.6 0 0 0-4.5-6.8zM7.5 13.3a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm9 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
          <span class="dl-text">
            <span class="dl-title" data-t="apkTitle"></span>
            <span class="dl-sub" data-t="apkSub"></span>
          </span>
        </a>
      </div>

      <p class="meta" id="meta"></p>
      <p class="hint" id="hint"></p>

      <a class="more" href="#help">
        <span data-t="newsCue"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </section>

    <section class="help" id="help">
      <div class="panel">
        <h2 data-t="helpTitle"></h2>
        <div id="help-cards" class="help-cards"></div>
        <p class="help-note" data-t="helpNote"></p>
      </div>
    </section>

    <section class="news" id="news">
      <div class="panel">
        <h2 data-t="newsTitle"></h2>
        <div id="news-list" class="news-list"></div>
      </div>
      <footer class="footer">© <span id="year">2026</span> Akane Lee. <span data-t="rights"></span></footer>
    </section>
  </main>


  <script src="main.js"></script>
</body>
</html>
